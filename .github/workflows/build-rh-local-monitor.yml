name: Build RH Work Local Monitor

on:
  push:
    branches: [rh-work-cloud-deploy]
    paths:
      - 'rh-work-cloud/local-agent/**'
      - '.github/workflows/build-rh-local-monitor.yml'
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          Set-Location rh-work-cloud/local-agent
          npm install --omit=dev

      - name: Assemble portable package
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'rh-work-cloud\local-agent'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist\RH-Work-Local-Monitor'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item (Get-Command node.exe).Source (Join-Path $dist 'node.exe')
          Copy-Item (Join-Path $src 'agent.js') $dist
          Copy-Item (Join-Path $src 'start.cmd') $dist
          Copy-Item (Join-Path $src 'start-hidden.vbs') $dist
          Copy-Item (Join-Path $src 'install-autostart.cmd') $dist
          Copy-Item (Join-Path $src 'README.md') $dist
          Copy-Item (Join-Path $src 'node_modules') (Join-Path $dist 'node_modules') -Recurse
          Compress-Archive -Path "$dist\*" -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'RH-Work-Local-Monitor.zip') -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RH-Work-Local-Monitor
          path: RH-Work-Local-Monitor.zip
          retention-days: 30
