<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b63f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="号码筛选"><title>号码筛选助手</title><style>:root{--blue:#0b63f6;--blue2:#3b82f6;--bg:#f4f8ff;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#dbeafe;--danger:#ef4444;--dangerBg:#fff1f2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef5ff 0,#f8fbff 220px,#f4f8ff 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}.hero{background:linear-gradient(135deg,#0b63f6,#4f8df7);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px rgba(11,99,246,.18)}.hero h1{margin:0;font-size:22px}.hero p{margin:6px 0 0;font-size:12px;opacity:.86}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:11px 8px;text-align:center;backdrop-filter:blur(10px)}.stat b{display:block;font-size:22px}.stat span{font-size:10px;opacity:.86}.wrap{padding:14px;max-width:720px;margin:auto}.alertbox{margin-top:-2px;background:var(--card);border:1px solid #fecaca;border-radius:20px;padding:14px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.alerthead{display:flex;align-items:center;justify-content:space-between;gap:10px}.alerttitle{font-size:15px;font-weight:800}.pill{background:#fee2e2;color:#b91c1c;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.empty{color:#94a3b8;font-size:13px;padding:12px 0}.hit{margin-top:10px;padding:12px;border-radius:15px;background:var(--dangerBg);border:1px solid #fecdd3}.num{font-size:19px;font-weight:900;letter-spacing:.2px;word-break:break-all}.meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:700;font-size:13px}.btn.primary{background:var(--blue);color:#fff}.btn.soft{background:#eff6ff;color:#1d4ed8}.btn.danger{background:#fff;color:#dc2626;border:1px solid #fecaca}.card{background:var(--card);border:1px solid #e5efff;border-radius:20px;padding:15px;margin-top:12px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.card h2{margin:0;font-size:16px}.sub{font-size:12px;color:var(--muted);margin:5px 0 12px}.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:#f8fbff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;font-weight:800;color:#1e3a8a}.hidden{display:none!important}textarea,input,select{width:100%;border:1px solid #cfe0ff;background:#fbfdff;border-radius:14px;padding:12px 13px;font:inherit;outline:none}textarea{min-height:120px;resize:vertical;line-height:1.5}input:focus,textarea:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.11)}.label{font-size:12px;font-weight:800;color:#334155;margin:12px 0 7px}.grid2{display:grid;grid-template-columns:1fr 120px;gap:8px}.fullbtn{width:100%;margin-top:10px}.librarytable{overflow:auto;border:1px solid #e2e8f0;border-radius:14px;margin-top:12px}.librarytable table{width:100%;border-collapse:collapse;min-width:620px;font-size:12px}.librarytable th,.librarytable td{padding:10px;border-bottom:1px solid #eef2f7;text-align:left;white-space:nowrap}.librarytable th{background:#f8fbff;color:#475569}.pending{display:flex;flex-direction:column;gap:9px}.pendingitem{border:1px solid #e2e8f0;border-radius:16px;padding:12px;background:#fff}.pendingitem.match{background:#fff7f7;border-color:#fecaca}.pending-top{display:flex;justify-content:space-between;gap:8px}.status{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;background:#ecfdf5;color:#047857;height:max-content}.status.match{background:#fee2e2;color:#b91c1c}.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-top:1px solid #e2e8f0;z-index:20}.bottomin{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1.25fr;gap:8px}.bottom .btn{padding:13px}.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,15px);opacity:0;background:#0f172a;color:#fff;border-radius:12px;padding:9px 12px;font-size:12px;transition:.2s;z-index:50}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:420px){.grid2{grid-template-columns:1fr 108px}.hero{border-radius:0 0 24px 24px}.wrap{padding:12px}.card,.alertbox{border-radius:18px}}</style></head><body><div class="app"><header class="hero"><h1>号码筛选助手</h1><p>号码库 5 天有效 · 待筛选号码长期保留</p><div class="stats"><div class="stat"><b id="libCount">0</b><span>号码库</span></div><div class="stat"><b id="pendingCount">0</b><span>待筛选</span></div><div class="stat"><b id="hitCount">0</b><span>强提醒</span></div></div></header><main class="wrap"><section class="alertbox"><div class="alerthead"><div><div class="alerttitle">强提醒</div><div class="sub" style="margin:3px 0 0">命中号码优先显示在这里</div></div><span class="pill" id="hitPill">0 个命中</span></div><div id="alerts" class="empty">当前没有命中号码</div></section><section class="card"><h2>待筛选号码</h2><div class="sub">添加一次后会保存在当前手机浏览器，之后可随时重新筛选。</div><textarea id="pendingInput" placeholder="添加待筛选号码"></textarea><button id="addPending" class="btn primary fullbtn">保存待筛选号码</button><div class="acts"><button id="rescan" class="btn soft">重新筛选全部</button><button id="exportData" class="btn soft">导出备份</button><label class="btn soft" style="display:inline-block;cursor:pointer">导入备份<input id="importData" type="file" accept=".json,application/json" hidden></label></div><div id="pendingList" class="pending" style="margin-top:12px"></div></section><section class="card"><button id="libToggle" class="toggle"><span>号码库</span><span id="libToggleText">展开</span></button><div id="libPanel" class="hidden"><div class="label">批次日期</div><div class="grid2"><input id="libDate" type="date"><select id="libPeriod"><option value="早上">早上</option><option value="晚上">晚上</option></select></div><div class="label">添加号码</div><textarea id="libInput" placeholder="每行一个号码，也支持空格、逗号、分号分隔"></textarea><button id="addLib" class="btn primary fullbtn">加入号码库</button><div class="librarytable"><table><thead><tr><th>号码</th><th>批次</th><th>加入</th><th>到期</th><th>操作</th></tr></thead><tbody id="libRows"></tbody></table></div></div></section></main><div class="bottom"><div class="bottomin"><button id="openLib" class="btn soft">号码库</button><button id="bottomScan" class="btn primary">立即筛选</button></div></div><div id="toast" class="toast"></div></div><script>const KL='nf_lib_v3',KP='nf_pending_v3',FIVE=5*24*60*60*1000,$=id=>document.getElementById(id);const now=()=>Date.now();function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function norm(s){s=String(s||'').trim();if(!s)return'';const plus=s.startsWith('+'),d=s.replace(/\D/g,'');return d?(plus?'+'+d:d):''}function parse(t){return[...new Set(String(t||'').split(/[\s,，;；、]+/).map(norm).filter(Boolean))]}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(ts){return new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}function cleanup(){const a=load(KL),b=a.filter(x=>x.expiresAt>now());if(a.length!==b.length)save(KL,b);return b}function libMap(){const a=cleanup(),m=new Map();for(const r of a){if(!m.has(r.number))m.set(r.number,[]);m.get(r.number).push(r)}return[a,m]}function uid(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('on'),1800)}function rescan(silent=false){const[,m]=libMap();let p=load(KP);p=p.map(x=>{const hit=m.has(x.number);x.hit=hit;x.sources=hit?m.get(x.number).map(r=>r.batch):[];if(!hit)x.dismissed=false;return x});save(KP,p);render();if(!silent)toast('已重新筛选全部号码')}function render(){const[lib,m]=libMap();const p=load(KP).sort((a,b)=>(b.hit&&!b.dismissed)-(a.hit&&!a.dismissed)||b.createdAt-a.createdAt);const hits=p.filter(x=>x.hit&&!x.dismissed);$('libCount').textContent=m.size;$('pendingCount').textContent=p.length;$('hitCount').textContent=hits.length;$('hitPill').textContent=hits.length+' 个命中';$('alerts').className=hits.length?'':'empty';$('alerts').innerHTML=hits.length?hits.map(x=>`<div class="hit"><div class="num">${esc(x.number)}</div><div class="meta">命中批次：${(x.sources||[]).map(esc).join('、')||'号码库'}</div><div class="acts"><button class="btn soft" onclick="dismissHit('${x.id}')">消除提醒</button><button class="btn danger" onclick="removePending('${x.id}')">移除号码</button></div></div>`).join(''):'当前没有命中号码';$('libRows').innerHTML=lib.length?lib.sort((a,b)=>b.createdAt-a.createdAt).map(r=>`<tr><td><b>${esc(r.number)}</b></td><td>${esc(r.batch)}</td><td>${fmt(r.createdAt)}</td><td>${fmt(r.expiresAt)}</td><td><button class="btn danger" style="padding:6px 8px" onclick="removeLib('${r.id}')">删除</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">号码库暂无号码</td></tr>';$('pendingList').innerHTML=p.length?p.map(x=>`<div class="pendingitem ${x.hit?'match':''}"><div class="pending-top"><div class="num">${esc(x.number)}</div><span class="status ${x.hit?'match':''}">${x.hit?(x.dismissed?'已消除':'命中'):'未命中'}</span></div>${x.hit?`<div class="meta">命中：${(x.sources||[]).map(esc).join('、')}</div>`:''}<div class="acts">${x.hit&&!x.dismissed?`<button class="btn soft" onclick="dismissHit('${x.id}')">消除提醒</button>`:''}${x.hit&&x.dismissed?`<button class="btn soft" onclick="restoreHit('${x.id}')">恢复提醒</button>`:''}<button class="btn danger" onclick="removePending('${x.id}')">删除</button></div></div>`).join(''):'<div class="empty">还没有待筛选号码</div>'}window.dismissHit=id=>{const p=load(KP),x=p.find(v=>v.id===id);if(x){x.dismissed=true;save(KP,p);render()}};window.restoreHit=id=>{const p=load(KP),x=p.find(v=>v.id===id);if(x){x.dismissed=false;save(KP,p);render()}};window.removePending=id=>{if(!confirm('确定删除这个待筛选号码？'))return;save(KP,load(KP).filter(x=>x.id!==id));render()};window.removeLib=id=>{if(!confirm('确定从号码库删除这个号码？'))return;save(KL,load(KL).filter(x=>x.id!==id));rescan(true)};$('libToggle').onclick=()=>{const p=$('libPanel'),open=p.classList.toggle('hidden')===false;$('libToggleText').textContent=open?'收起':'展开'};$('openLib').onclick=()=>{$('libPanel').classList.remove('hidden');$('libToggleText').textContent='收起';$('libToggle').scrollIntoView({behavior:'smooth',block:'start'})};$('addLib').onclick=()=>{const ns=parse($('libInput').value);if(!ns.length)return toast('请先输入号码');const d=$('libDate').value||new Date().toISOString().slice(0,10),period=$('libPeriod').value,batch=d+' '+period,t=now(),arr=load(KL);for(const n of ns)arr.push({id:uid('l'),number:n,batch,createdAt:t,expiresAt:t+FIVE});save(KL,arr);$('libInput').value='';rescan(true);toast('已加入号码库，有效期 5 天')};$('addPending').onclick=()=>{const ns=parse($('pendingInput').value);if(!ns.length)return toast('请先输入号码');const p=load(KP),exist=new Set(p.map(x=>x.number)),t=now();let added=0;for(const n of ns)if(!exist.has(n)){p.push({id:uid('p'),number:n,createdAt:t,hit:false,dismissed:false,sources:[]});exist.add(n);added++}save(KP,p);$('pendingInput').value='';rescan(true);toast('已保存 '+added+' 个待筛选号码')};$('rescan').onclick=()=>rescan(false);$('bottomScan').onclick=()=>rescan(false);$('exportData').onclick=()=>{const data={library:load(KL),pending:load(KP),exportedAt:new Date().toISOString()},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='号码筛选备份.json';a.click();URL.revokeObjectURL(u)};$('importData').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.library)||!Array.isArray(d.pending))throw 0;if(confirm('导入会覆盖当前数据，是否继续？')){save(KL,d.library);save(KP,d.pending);rescan(true);toast('备份已导入')}}catch{toast('备份文件格式不正确')}e.target.value=''};$('libDate').value=new Date().toISOString().slice(0,10);cleanup();rescan(true);</script></body></html>
